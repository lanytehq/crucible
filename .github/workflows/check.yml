name: check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install jsonschema (dispatch v0 family gate — hard requirement of make check)
        run: python3 -m pip install jsonschema
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install goneat (fmt-check hard requirement of make check)
        run: |
          go install github.com/fulmenhq/goneat@v0.5.16
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          goneat version
      - name: Repo Checks
        run: |
          make check
          make quality
